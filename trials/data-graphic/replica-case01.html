<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>data-graphic 试做 · case-01 复刻</title>
<style>
@font-face {
  font-family: 'Noto Sans SC';
  src: url('../../fonts/source-han-sans/NotoSansSC-VF.ttf') format('truetype');
  font-weight: 100 900;
  font-display: swap;
}
:root {
  --c-bg: #f3f3f3;
  --c-ink: #0a0a0a;
  --c-label: #1a1a1a;
  --c-muted: #666666;
  --c-primary: #fa4d00;
  --c-brand: #ff6900;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #e2e2e2; }
.poster {
  position: absolute;
  left: 50%; top: 50%;
  width: 1080px; height: 1440px;
  transform: translate(-50%, -50%);
  overflow: hidden;
  background: var(--c-bg);
  color: var(--c-ink);
  font-family: 'Noto Sans SC', 'MiSans', 'PingFang SC', system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
  padding: 76px;
}
@page { size: 1080px 1440px; margin: 0; }
@media print {
  html, body { width: 1080px; height: 1440px; overflow: hidden; background: var(--c-bg); }
  .poster { left: 0; top: 0; transform: none; }
}
.meta-row {
  display: flex; justify-content: space-between; align-items: flex-start;
}
.meta {
  font-size: 33px; font-weight: 500; color: var(--c-label); line-height: 1.3;
}
.logo {
  width: 88px; height: 88px; border-radius: 20px;
  background: var(--c-brand); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px; font-weight: 800; letter-spacing: -0.02em;
  flex: none;
}
.headline {
  margin-top: 42px;
  font-size: 138px; line-height: 1.16; font-weight: 900;
  letter-spacing: 0.015em; color: var(--c-ink);
}
.kpis {
  margin-top: 66px;
  display: flex; gap: 8%;
}
.kpi { flex: 1; }
.kpi .label { font-size: 31px; font-weight: 500; color: var(--c-label); }
.kpi .num-row {
  margin-top: 10px;
  display: flex; align-items: baseline; gap: 10px;
  color: var(--c-primary);
}
.kpi .num { font-size: 158px; font-weight: 700; line-height: 1.02; letter-spacing: -0.01em; }
.kpi .unit { font-size: 48px; font-weight: 600; }
.kpi .yoy { margin-top: 16px; font-size: 34px; color: var(--c-label); }
.kpi .yoy b { color: var(--c-primary); font-weight: 600; }
.section {
  margin-top: 74px;
  font-size: 41px; font-weight: 800; color: var(--c-ink);
  letter-spacing: 0.01em;
}
.charts {
  margin-top: 42px;
  display: flex; gap: 6%;
}
.chart { flex: 1; min-width: 0; }
.chart .cl { font-size: 27px; font-weight: 500; color: var(--c-label); line-height: 1.3; }
.chart .cl small { display: block; font-size: 24px; font-weight: 400; color: var(--c-muted); }
.chart svg { width: 100%; height: auto; display: block; margin-top: 8px; }
.axis {
  margin-top: 6px;
  display: flex; justify-content: space-between;
  font-size: 23px; font-weight: 400; color: #333;
  padding: 0 4px;
}
</style>
</head>
<body>
<div class="poster" data-od-id="data-graphic-trial">

  <header class="meta-row" data-od-id="meta-row">
    <div class="meta">小米集团 2021年Q2财报</div>
    <div class="logo" aria-label="品牌标">mi</div>
  </header>

  <h1 class="headline" data-od-id="headline">全力以赴<br>奔向梦想</h1>

  <section class="kpis" data-od-id="kpi-row">
    <div class="kpi" data-od-id="kpi-revenue">
      <div class="label">总营收人民币</div>
      <div class="num-row"><span class="num">878</span><span class="unit">亿元</span></div>
      <div class="yoy">同比增长 <b>64.0%</b></div>
    </div>
    <div class="kpi" data-od-id="kpi-profit">
      <div class="label">经调整净利润人民币</div>
      <div class="num-row"><span class="num">63</span><span class="unit">亿元</span></div>
      <div class="yoy">同比增长 <b>87.4%</b></div>
    </div>
  </section>

  <h2 class="section" data-od-id="section-title">营收净利润持续增长&emsp;再创历史新高</h2>

  <section class="charts" data-od-id="charts-row">
    <div class="chart" data-od-id="chart-revenue">
      <div class="cl">营收<small>（人民币亿元）</small></div>
      <!-- y = 270 - (v-500)/400*230 ; v: 520/535/878 -->
      <svg viewBox="0 0 460 310" role="img" aria-label="营收折线图：520、535、878">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fa4d00" stop-opacity=".22"/>
            <stop offset="1" stop-color="#fa4d00" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="36,258 230,250 424,53 424,290 36,290" fill="url(#g1)"/>
        <polyline points="36,258 230,250 424,53" fill="none" stroke="#fa4d00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="36" cy="258" r="6" fill="#fff" stroke="#fa4d00" stroke-width="3.5"/>
        <circle cx="230" cy="250" r="6" fill="#fff" stroke="#fa4d00" stroke-width="3.5"/>
        <circle cx="424" cy="53" r="6" fill="#fff" stroke="#fa4d00" stroke-width="3.5"/>
        <text x="36" y="232" font-size="30" font-weight="600" fill="#fa4d00" text-anchor="start">520</text>
        <text x="230" y="224" font-size="30" font-weight="600" fill="#fa4d00" text-anchor="middle">535</text>
        <text x="424" y="29" font-size="30" font-weight="600" fill="#fa4d00" text-anchor="end">878</text>
      </svg>
      <div class="axis"><span>2019Q2</span><span>2020Q2</span><span>2021Q2</span></div>
    </div>
    <div class="chart" data-od-id="chart-profit">
      <div class="cl">经调整净利<small>（人民币亿元）</small></div>
      <!-- y = 270 - (v-30)/35*230 ; v: 36/34/63 -->
      <svg viewBox="0 0 460 310" role="img" aria-label="经调整净利润折线图：36、34、63">
        <defs>
          <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fa4d00" stop-opacity=".22"/>
            <stop offset="1" stop-color="#fa4d00" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="36,231 230,244 424,53 424,290 36,290" fill="url(#g2)"/>
        <polyline points="36,231 230,244 424,53" fill="none" stroke="#fa4d00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="36" cy="231" r="6" fill="#fff" stroke="#fa4d00" stroke-width="3.5"/>
        <circle cx="230" cy="244" r="6" fill="#fff" stroke="#fa4d00" stroke-width="3.5"/>
        <circle cx="424" cy="53" r="6" fill="#fff" stroke="#fa4d00" stroke-width="3.5"/>
        <text x="36" y="205" font-size="30" font-weight="600" fill="#fa4d00" text-anchor="start">36</text>
        <text x="230" y="216" font-size="30" font-weight="600" fill="#fa4d00" text-anchor="middle">34</text>
        <text x="424" y="29" font-size="30" font-weight="600" fill="#fa4d00" text-anchor="end">63</text>
      </svg>
      <div class="axis"><span>2019Q2</span><span>2020Q2</span><span>2021Q2</span></div>
    </div>
  </section>

</div>
<script>
(function () {
  var p = document.querySelector('.poster');
  function fit() {
    var s = Math.min(window.innerWidth / 1080, window.innerHeight / 1440);
    p.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
