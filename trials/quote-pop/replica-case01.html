<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: "Noto Serif SC";
    src: url("../../fonts/source-han-serif/NotoSerifSC-VF.ttf");
    font-weight: 300 800;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; background: #fff; }
  .poster {
    position: relative;
    width: 1080px;
    height: 1080px;
    margin: 0 auto;
    background: #d3f606;
    overflow: hidden;
    font-family: "Noto Serif SC", Georgia, serif;
  }
  .quote {
    position: absolute;
    left: 63px;
    top: 592px;
    font-size: 56px;
    line-height: 70px;
    font-weight: 600;
    color: #111111;
    letter-spacing: 0;
  }
  .divider {
    position: absolute;
    left: 81px;
    top: 849px;
    width: 179px;
    height: 3px;
    background: #8a3d00;
  }
  .name {
    position: absolute;
    left: 63px;
    top: 893px;
    font-size: 44px;
    line-height: 1.2;
    font-weight: 600;
    color: #111111;
  }
  .role {
    position: absolute;
    left: 92px;
    top: 963px;
    font-size: 29px;
    line-height: 1.2;
    font-weight: 500;
    color: #111111;
  }
</style>
</head>
<body>
<div class="poster">
  <svg width="1080" height="1080" viewBox="0 0 1080 1080" style="position:absolute;inset:0">
    <defs>
      <clipPath id="qmark">
        <path d="M 566,104 L 939,104 Q 999,104 999,164 L 999,571 Q 999,631 939,631 L 566,631 Q 506,631 506,571 L 506,164 Q 506,104 566,104 Z"/>
        <path d="M 646,646 L 869,646 Q 929,646 929,700 L 929,922 Q 929,976 869,976 L 646,976 Q 600,976 600,922 L 600,700 Q 600,646 646,646 Z"/>
      </clipPath>
    </defs>
    <image href="assets/speaker-portrait.jpg" x="506" y="-30" width="493" height="1006"
           preserveAspectRatio="xMidYMid slice"
           clip-path="url(#qmark)"
           style="filter: grayscale(1) brightness(0.92) contrast(1.18)"/>
  </svg>
  <div class="quote">We are pencils<br>in the hand<br>of the Creator.</div>
  <div class="divider"></div>
  <div class="name">- Zion Jewel</div>
  <div class="role">Inspirational Speaker</div>
</div>
</body>
</html>
