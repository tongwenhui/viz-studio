:root{

  --c-bg-hi:#182a44;
  --c-bg-lo:#0a1422;
  --c-gold:#c9a35c;
  --c-gold-hi:#e8c98a;
  --c-ink:#f2ead9;
  --c-muted:#93a5bd;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{margin:0;background:#000;}
.poster{position:relative;width:1080px;height:1440px;overflow:hidden;
  background:radial-gradient(ellipse 920px 1150px at 50% 40%,var(--c-bg-hi) 0%,var(--c-bg) 52%,var(--c-bg-lo) 100%);
  font-family:'Noto Serif SC',serif;}
.star{position:absolute;border-radius:50%;background:var(--c-gold);}
.kicker{position:absolute;top:84px;left:0;width:100%;text-align:center;
  font-family:'Bodoni Moda',serif;font-weight:400;font-variation-settings:'opsz' 96,'wght' 400;
  font-size:25px;letter-spacing:.52em;text-indent:.52em;color:var(--c-gold);}
.letterhead{position:absolute;top:130px;left:0;width:100%;text-align:center;
  font-size:25px;font-weight:400;letter-spacing:.18em;text-indent:.18em;color:var(--c-muted);}
.dial{position:absolute;left:90px;top:150px;width:900px;height:900px;}
.dial svg{display:block;}
.core{position:absolute;left:540px;top:600px;transform:translate(-50%,-52%);text-align:center;}
.numeral{font-family:'Bodoni Moda',serif;font-weight:400;font-variation-settings:'opsz' 96,'wght' 400;
  font-size:285px;line-height:.8;color:var(--c-gold-hi);}
.core-sub{margin-top:28px;font-family:'Bodoni Moda',serif;font-weight:400;
  font-size:17px;letter-spacing:.46em;text-indent:.46em;color:var(--c-gold);}
.couplet{position:absolute;top:1058px;left:0;width:100%;text-align:center;
  font-weight:600;line-height:1.16;}
.couplet .l1{display:block;font-size:94px;color:var(--c-ink);letter-spacing:.08em;text-indent:.08em;}
.couplet .l2{display:block;font-size:94px;color:var(--c-gold-hi);letter-spacing:.08em;text-indent:.08em;}
.bottom-rule{position:absolute;top:1312px;left:50%;transform:translateX(-50%);
  width:160px;height:1px;background:var(--c-gold);opacity:.45;}
.date{position:absolute;top:1334px;left:0;width:100%;text-align:center;
  font-size:29px;font-weight:500;letter-spacing:.08em;text-indent:.08em;color:var(--c-ink);}
